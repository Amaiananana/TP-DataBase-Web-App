{% load static %} 

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <title>Profile</title>
</head>

<body>
    <div class="header1">
        <h1 style="text-align: center; color: #333; font-family: 'Poppins', sans-serif; padding: 2%;">Welcome, {{ user.fname }}!</h1>
    </div>
    <div class="container">
        <div class="profile-card">
            <h2 style="text-align: center;">Student Information</h2>

            <h style="font-weight: 800;">Name</h>
            <p style="margin-left: 7%;">{{ user.fname }} {{ user.mname}} {{ user.lname}}</p>

            <h style="font-weight: 800;">Email</h>
            <p style="margin-left: 7%;">{{ user.email }}</p>

            <h style="font-weight: 800;">Gender</h>
            <p style="margin-left: 7%;">{{ user.get_gender_display}}</p>

            <h style="font-weight: 800;">Date of Birth</h>
            <p style="margin-left: 7%;">{{ user.dob }}</p>

            <h style="font-weight: 800;">Course</h>
            <p style="margin-left: 7%;">{{ user.get_course_display}}</p>   
        </div> 
            <button onclick="window.location.href='/home'"; style="width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 400;
            margin-top: 20px;"> Register New User</button>
    </div>      
</html>
